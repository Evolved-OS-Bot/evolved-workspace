<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evolved CEO Dashboard</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh;margin:0}
    main{width:min(420px,calc(100% - 40px));background:#1f2937;border:1px solid #374151;border-radius:18px;padding:32px}
    h1{margin:0 0 8px}p{color:#9ca3af}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin-top:10px}
    input{background:#111827;border:1px solid #4b5563;color:#fff}button{background:#d5ff3f;border:0;font-weight:700;cursor:pointer}.error{color:#fca5a5}
  </style>
</head>
<body><main>
  <h1>Evolved CEO Dashboard</h1>
  <p>Private operating-data hub</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post"><input type="password" name="password" placeholder="Dashboard password" required><button>Sign in</button></form>
</main></body></html>
