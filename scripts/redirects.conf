# redirects.conf
# 301 Redirect Rules — The Evolved Website Migration
# Generated: 2026-04-30
#
# PURPOSE: Redirect blog.theevolvedgym.com.au → theevolvedgym.com.au/blog/
# These rules handle the subdomain-to-root-path migration.
#
# IMPLEMENTATION OPTIONS:
#   Option A — SiteGround (Apache / .htaccess):
#     Upload/merge into blog.theevolvedgym.com.au .htaccess (see below)
#   Option B — WordPress Redirection plugin:
#     Import the CSV version at the bottom of this file
#   Option C — Cloudflare Page Rules (if using Cloudflare):
#     Create a forwarding URL rule (see notes)
#
# NOTE: The preferred approach is to add these to the WordPress Redirection
# plugin BEFORE the DNS cutover. Once DNS points theevolvedgym.com.au to
# WordPress/SiteGround, WordPress handles the incoming requests and
# the Redirection plugin fires on the blog.theevolvedgym.com.au requests
# (once that domain is also pointed at SiteGround).
#
# ─────────────────────────────────────────────────────────────────────────────
# APACHE (.htaccess) — for blog.theevolvedgym.com.au
# ─────────────────────────────────────────────────────────────────────────────

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Force HTTPS on root domain (should already be set by SiteGround)
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

    # Redirect all blog subdomain traffic to root domain /blog/
    # This rule lives on blog.theevolvedgym.com.au virtual host
    RewriteCond %{HTTP_HOST} ^blog\.theevolvedgym\.com\.au$ [NC]
    RewriteRule ^(.*)$ https://theevolvedgym.com.au/blog/$1 [R=301,L]

    # Redirect bare blog subdomain root to /blog/
    RewriteCond %{HTTP_HOST} ^blog\.theevolvedgym\.com\.au$ [NC]
    RewriteRule ^$ https://theevolvedgym.com.au/blog/ [R=301,L]
</IfModule>

# ─────────────────────────────────────────────────────────────────────────────
# NGINX — equivalent server block
# ─────────────────────────────────────────────────────────────────────────────
#
# server {
#     server_name blog.theevolvedgym.com.au;
#     return 301 https://theevolvedgym.com.au/blog/$request_uri;
# }

# ─────────────────────────────────────────────────────────────────────────────
# CLOUDFLARE PAGE RULES (if applicable)
# ─────────────────────────────────────────────────────────────────────────────
#
# Rule 1 — Subdomain root
#   URL: blog.theevolvedgym.com.au/*
#   Setting: Forwarding URL (301 Permanent Redirect)
#   Destination: https://theevolvedgym.com.au/blog/$1
#
# Rule 2 — Ensure HTTPS everywhere
#   URL: http://*.theevolvedgym.com.au/*
#   Setting: Always Use HTTPS

# ─────────────────────────────────────────────────────────────────────────────
# SPECIFIC ARTICLE REDIRECTS (to confirm slug parity post-migration)
# ─────────────────────────────────────────────────────────────────────────────
# WordPress typically preserves slugs from the Groove.cm blog migration.
# If any slugs differ between Groove.cm and WordPress, add explicit rules here.
#
# Format:
#   Redirect 301 /old-slug/ https://theevolvedgym.com.au/blog/new-slug/
#
# Example:
#   Redirect 301 /strength-training-over-50/ https://theevolvedgym.com.au/blog/best-strength-training-exercises-women-over-50/

# ─────────────────────────────────────────────────────────────────────────────
# WORDPRESS REDIRECTION PLUGIN — CSV IMPORT FORMAT
# ─────────────────────────────────────────────────────────────────────────────
# Import at: WordPress admin → Tools → Redirection → Import/Export → CSV
#
# source,target,regex,type
# /,https://theevolvedgym.com.au/blog/,0,301
# /(.*),https://theevolvedgym.com.au/blog/$1,1,301
#
# NOTE: Set the "URL source" to match only when host = blog.theevolvedgym.com.au
# in the Redirection plugin settings (Options → Monitor changes).

# ─────────────────────────────────────────────────────────────────────────────
# POST-MIGRATION VALIDATION
# ─────────────────────────────────────────────────────────────────────────────
# Verify redirect chain is clean (no double-hops) with:
#
#   curl -I https://blog.theevolvedgym.com.au/strength-training-postmenopause/
#
# Expected response chain:
#   HTTP/2 301  Location: https://theevolvedgym.com.au/blog/strength-training-postmenopause/
#   HTTP/2 200
#
# NOT acceptable:
#   301 → 301 → 200  (double redirect — bad for SEO)
#   301 → 302 → 200  (mixed redirect types)
